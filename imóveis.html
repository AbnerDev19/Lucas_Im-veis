<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Imóveis | Riva & Direcional</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* --- ESTILOS ESPECÍFICOS DESTA PÁGINA (FILTROS E MODAL) --- */
        
        /* Ajuste do topo para não ficar atrás do header */
        .catalog-header {
            padding-top: 120px;
            padding-bottom: 40px;
            text-align: center;
        }
        .catalog-header h1 { font-size: 3rem; letter-spacing: -1.5px; margin-bottom: 1rem; }
        
        /* Filtros (Pills) */
        .filters-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 3rem;
        }
        
        .filter-btn {
            background: #F5F5F7;
            border: 1px solid #E5E5E5;
            padding: 10px 24px;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: #666;
        }
        
        .filter-btn:hover { background: #E0E0E0; color: #000; }
        
        /* Estado Ativo do Filtro */
        .filter-btn.active {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        /* Grid de Imóveis (Reaproveita classes do style.css mas reforça aqui) */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            padding-bottom: 4rem;
        }

        /* --- MODAL (A Janela de Detalhes) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none; /* Escondido por padrão */
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.open { display: flex; opacity: 1; }

        .modal-card {
            background: #fff;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            border-radius: 24px;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            z-index: 10;
            border: none;
            transition: 0.2s;
        }
        .modal-close:hover { background: #fff; transform: scale(1.1); }

        .modal-img-container {
            width: 100%;
            height: 400px;
            background: #eee;
        }
        .modal-img-container img { width: 100%; height: 100%; object-fit: cover; }

        .modal-content { padding: 3rem; }
        .modal-tag { 
            background: #000; color: #fff; padding: 4px 12px; 
            border-radius: 999px; font-size: 0.8rem; font-weight: 700; 
            text-transform: uppercase; margin-bottom: 1rem; display: inline-block;
        }
        .modal-title { font-size: 2.5rem; margin-bottom: 0.5rem; line-height: 1.1; }
        .modal-loc { font-size: 1.1rem; color: #666; margin-bottom: 2rem; display: flex; align-items: center; gap: 6px; }

        .modal-specs {
            display: flex; gap: 20px; margin-bottom: 2rem;
            border-bottom: 1px solid #eee; padding-bottom: 2rem;
        }
        .spec-box { text-align: center; background: #F5F5F7; padding: 15px 25px; border-radius: 12px; }
        .spec-box strong { display: block; font-size: 1.2rem; }
        .spec-box span { font-size: 0.85rem; color: #666; }

        .modal-desc { line-height: 1.8; color: #444; margin-bottom: 2rem; }

        .modal-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
        }
        .modal-price { font-size: 1.8rem; font-weight: 800; }
        .btn-whatsapp-modal {
            background: #25D366; color: #fff;
            padding: 16px 32px; border-radius: 999px;
            font-weight: 700; font-size: 1rem;
            display: flex; align-items: center; gap: 10px;
            transition: 0.2s;
        }
        .btn-whatsapp-modal:hover { background: #1ebc57; transform: scale(1.05); }

        /* Responsividade */
        @media(max-width: 768px) {
            .catalog-header h1 { font-size: 2rem; }
            .modal-img-container { height: 250px; }
            .modal-content { padding: 1.5rem; }
            .modal-footer { flex-direction: column; gap: 15px; align-items: stretch; text-align: center; }
            .modal-specs { overflow-x: auto; padding-bottom: 10px; }
        }
    </style>
</head>
<body>

    <header id="header" class="scrolled"> <div class="container">
            <div class="logo" style="color: #000;">SeuNomeBroker.</div>
            <nav>
                <a href="index.html" style="color: #000;">Início</a>
                <a href="index.html#plantas" style="color: #000;">Plantas</a>
                <a href="#" class="btn-nav" style="background: #000; color: #fff !important;">WhatsApp</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <section class="catalog-header">
            <h1>Nossos Empreendimentos</h1>
            <p style="color: #86868B; margin-bottom: 2rem;">Selecione uma cidade para filtrar as opções.</p>
            
            <div class="filters-container" id="filters">
                <button class="filter-btn active" onclick="filterItems('all', this)">Todos</button>
                <button class="filter-btn" onclick="filterItems('Taguatinga', this)">Taguatinga</button>
                <button class="filter-btn" onclick="filterItems('Águas Claras', this)">Águas Claras</button>
                <button class="filter-btn" onclick="filterItems('Ceilândia', this)">Ceilândia</button>
                <button class="filter-btn" onclick="filterItems('Samambaia', this)">Samambaia</button>
                <button class="filter-btn" onclick="filterItems('Sobradinho', this)">Sobradinho</button>
                <button class="filter-btn" onclick="filterItems('Santa Maria', this)">Santa Maria</button>
                <button class="filter-btn" onclick="filterItems('Valparaíso', this)">Valparaíso</button>
                <button class="filter-btn" onclick="filterItems('Recanto das Emas', this)">Recanto das Emas</button>
            </div>
        </section>

        <div class="catalog-grid" id="grid">
            </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal()">×</button>
            
            <div class="modal-img-container">
                <img id="m-img" src="" alt="Imagem do Imóvel">
            </div>
            
            <div class="modal-content">
                <span class="modal-tag" id="m-status">LANÇAMENTO</span>
                <h2 class="modal-title" id="m-title">Título do Imóvel</h2>
                <div class="modal-loc"><i class="ph ph-map-pin"></i> <span id="m-loc">Localização</span></div>
                
                <div class="modal-specs">
                    <div class="spec-box">
                        <strong id="m-beds">2</strong>
                        <span>Quartos</span>
                    </div>
                    <div class="spec-box">
                        <strong id="m-baths">1</strong>
                        <span>Banheiro</span>
                    </div>
                    <div class="spec-box">
                        <strong id="m-area">52m²</strong>
                        <span>Área</span>
                    </div>
                </div>

                <div class="modal-desc">
                    <h3 style="margin-bottom: 10px;">Sobre o Imóvel</h3>
                    <p id="m-desc">Descrição completa aqui...</p>
                </div>

                <div class="modal-footer">
                    <div>
                        <span style="display:block; font-size:0.9rem; color:#666;">A partir de</span>
                        <span class="modal-price" id="m-price">R$ 000.000</span>
                    </div>
                    <button class="btn-whatsapp-modal" onclick="contactWhatsApp()">
                        <i class="ph ph-whatsapp-logo"></i> Simular Financiamento
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DADOS DOS IMÓVEIS ---
        const properties = [
            {
                id: 1,
                title: "Reserva Taguatinga",
                location: "Taguatinga, DF",
                status: "Lançamento",
                price: "R$ 245.000",
                beds: 2, baths: 1, area: "52m²",
                desc: "O Reserva Taguatinga oferece o equilíbrio perfeito entre conforto e praticidade. Localizado próximo ao JK Shopping, conta com lazer completo, piscina, academia e segurança 24h. Financiamento facilitado pela Caixa.",
                img: "https://images.unsplash.com/photo-1600596542815-2a4fa3041442?q=80&w=800"
            },
            {
                id: 2,
                title: "Top Life Club",
                location: "Ceilândia, DF",
                status: "Pronto",
                price: "R$ 290.000",
                beds: 3, baths: 2, area: "65m²",
                desc: "More em um verdadeiro resort. O Top Life Ceilândia possui mais de 20 itens de lazer, incluindo quadras poliesportivas e espaços gourmet. Próximo à estação de metrô e comércio local.",
                img: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=800"
            },
            {
                id: 3,
                title: "Vila das Águas",
                location: "Águas Claras, DF",
                status: "Na Planta",
                price: "R$ 199.000",
                beds: 1, baths: 1, area: "35m²",
                desc: "Compacto de luxo no coração de Águas Claras. Ideal para investidores ou solteiros. Rooftop com vista panorâmica e coworking no térreo.",
                img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?q=80&w=800"
            },
            {
                id: 4,
                title: "Residencial Santa Maria",
                location: "Santa Maria, DF",
                status: "Minha Casa Minha Vida",
                price: "R$ 180.000",
                beds: 2, baths: 1, area: "48m²",
                desc: "Saia do aluguel com parcelas menores que o valor do aluguel. Subsídio do governo de até 55 mil reais. Condomínio fechado com segurança.",
                img: "https://images.unsplash.com/photo-1580587771525-78b9dba3b91d?q=80&w=800"
            },
            {
                id: 5,
                title: "Altos de Sobradinho",
                location: "Sobradinho, DF",
                status: "Em Construção",
                price: "R$ 260.000",
                beds: 2, baths: 1, area: "55m²",
                desc: "Vista privilegiada para a serra e clima agradável. Apartamentos com varanda gourmet e acabamento diferenciado.",
                img: "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?q=80&w=800"
            },
            {
                id: 6,
                title: "Vista Samambaia",
                location: "Samambaia, DF",
                status: "Últimas Unidades",
                price: "R$ 230.000",
                beds: 2, baths: 1, area: "50m²",
                desc: "Localização estratégica perto do metrô. O Vista Samambaia é sinônimo de valorização. Aproveite as últimas unidades com desconto.",
                img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?q=80&w=800"
            },
            {
                id: 7,
                title: "Recanto Viver",
                location: "Recanto das Emas, DF",
                status: "Lançamento",
                price: "R$ 175.000",
                beds: 2, baths: 1, area: "46m²",
                desc: "O melhor custo-benefício da região. Entrada parcelada em até 60x direto com a construtora. Venha conhecer o decorado.",
                img: "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?q=80&w=800"
            },
            {
                id: 8,
                title: "Portal Valparaíso",
                location: "Valparaíso, GO",
                status: "Pronto",
                price: "R$ 150.000",
                beds: 2, baths: 1, area: "45m²",
                desc: "More no entorno com qualidade de vida. Próximo ao Shopping Sul. Documentação grátis (ITBI e Registro) por tempo limitado.",
                img: "https://images.unsplash.com/photo-1605276374104-dee2a0ed3cd6?q=80&w=800"
            }
        ];

        // --- RENDERIZAR CARDS ---
        const grid = document.getElementById('grid');

        function renderCards(filter = 'all') {
            grid.innerHTML = '';
            
            const filteredProps = filter === 'all' 
                ? properties 
                : properties.filter(p => p.location.includes(filter));

            if(filteredProps.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888; padding: 50px;">Nenhum imóvel encontrado nesta região.</p>';
                return;
            }

            filteredProps.forEach(prop => {
                const card = document.createElement('div');
                card.className = 'card'; // Classe do style.css
                // Adiciona o evento de clique para abrir o modal
                card.onclick = () => openModal(prop); 
                card.style.cursor = 'pointer';

                card.innerHTML = `
                    <div class="card-img">
                        <img src="${prop.img}" alt="${prop.title}">
                        <span class="badge">${prop.status}</span>
                    </div>
                    <div class="card-content">
                        <span class="card-loc"><i class="ph ph-map-pin"></i> ${prop.location}</span>
                        <h3 class="card-title">${prop.title}</h3>
                        <div class="specs">
                            <span>${prop.beds} Qts</span>
                            <span>${prop.baths} Ban</span>
                            <span>${prop.area}</span>
                        </div>
                        <div class="card-action">
                            <span class="price">${prop.price}</span>
                            <button class="btn-text">Ver Detalhes</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- FILTROS ---
        function filterItems(location, btn) {
            // Remove active de todos
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            // Adiciona no clicado
            btn.classList.add('active');
            // Filtra
            renderCards(location);
        }

        // --- LÓGICA DO URL (Se vier da Home com filtro) ---
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const localFilter = params.get('local');
            
            if(localFilter) {
                // Tenta achar o botão correspondente para ativar visualmente
                const btns = document.querySelectorAll('.filter-btn');
                btns.forEach(b => {
                    if(b.innerText.includes(localFilter)) {
                        b.classList.add('active');
                        // Remove do "Todos"
                        btns[0].classList.remove('active');
                    }
                });
                renderCards(localFilter);
            } else {
                renderCards('all');
            }
        }

        // --- MODAL LÓGICA ---
        let currentProp = null;
        const modal = document.getElementById('modal');

        function openModal(prop) {
            currentProp = prop;
            
            // Preenche os dados
            document.getElementById('m-img').src = prop.img;
            document.getElementById('m-status').innerText = prop.status;
            document.getElementById('m-title').innerText = prop.title;
            document.getElementById('m-loc').innerText = prop.location;
            document.getElementById('m-beds').innerText = prop.beds;
            document.getElementById('m-baths').innerText = prop.baths;
            document.getElementById('m-area').innerText = prop.area;
            document.getElementById('m-desc').innerText = prop.desc;
            document.getElementById('m-price').innerText = prop.price;

            // Abre
            modal.classList.add('open');
            document.body.style.overflow = 'hidden'; // Trava scroll do fundo
        }

        function closeModal() {
            modal.classList.remove('open');
            document.body.style.overflow = 'auto';
        }

        // Fechar ao clicar fora
        modal.addEventListener('click', (e) => {
            if(e.target === modal) closeModal();
        });

        // WhatsApp do Modal
        function contactWhatsApp() {
            if(!currentProp) return;
            const phone = "5561999999999"; // SEU NÚMERO
            const text = `Olá! Vi o imóvel *${currentProp.title}* (${currentProp.location}) no site e gostaria de uma simulação.`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
        }

    </script>
</body>
</html>
