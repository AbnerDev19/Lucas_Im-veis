<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Imóveis | Riva & Direcional</title>

    <meta name="description" content="Catálogo completo de imóveis. Filtre por cidade e veja detalhes com atendimento via WhatsApp.">
    <meta name="theme-color" content="#0B0B0D">

    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* =========================================================
           ESTILOS ESPECÍFICOS DESTA PÁGINA (FILTROS E MODAL)
           Mantém suas classes/estrutura, só melhora estética/UX
           ========================================================= */

        .catalog-header {
            padding-top: 118px;
            padding-bottom: 34px;
            text-align: center;
        }

        .catalog-header h1 {
            font-size: clamp(2rem, 4vw, 3.05rem);
            letter-spacing: -1.6px;
            margin-bottom: 0.75rem;
            line-height: 1.05;
        }

        .catalog-header p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 1.08rem;
        }

        /* Filtros (Pills) */
        .filters-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 2.8rem;
        }

        .filter-btn {
            background: rgba(246,247,249,0.9);
            border: 1px solid rgba(0,0,0,0.10);
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform var(--transition-fast), background var(--transition-fast), border-color var(--transition-fast);
            color: var(--text-secondary);
        }

        .filter-btn:hover {
            background: rgba(0,0,0,0.04);
            transform: translateY(-1px);
            border-color: rgba(0,0,0,0.14);
            color: var(--text-main);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--color-black), #1C1C22);
            color: #fff;
            border-color: rgba(0,0,0,0.22);
            box-shadow: 0 14px 38px rgba(0,0,0,0.18);
        }

        /* Grid */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.85rem;
            padding-bottom: 4rem;
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.58);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
            padding: 18px;
        }
        .modal-overlay.open { display: flex; opacity: 1; }

        .modal-card {
            background: rgba(255,255,255,0.96);
            width: 100%;
            max-width: 920px;
            max-height: 90vh;
            border-radius: 26px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 30px 90px rgba(0,0,0,0.38);
            animation: slideUp 0.35s ease;
            border: 1px solid rgba(0,0,0,0.08);
        }

        @keyframes slideUp {
            from { transform: translateY(26px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 16px; right: 16px;
            background: rgba(255,255,255,0.92);
            border-radius: 999px;
            padding: 10px 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 1.25rem;
            z-index: 10;
            border: 1px solid rgba(0,0,0,0.10);
            transition: transform var(--transition-fast), background var(--transition-fast);
        }
        .modal-close:hover { background: #fff; transform: translateY(-1px); }

        .modal-img-container {
            width: 100%;
            height: 410px;
            background: #eee;
            position: relative;
        }

        .modal-img-container::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.38), transparent 55%);
            pointer-events: none;
        }

        .modal-img-container img { width: 100%; height: 100%; object-fit: cover; }

        .modal-content { padding: 2.6rem; }

        .modal-tag {
            background: linear-gradient(135deg, var(--color-black), #1C1C22);
            color: #fff;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 1rem;
            display: inline-flex;
            gap: 8px;
            align-items: center;
            letter-spacing: 0.6px;
        }

        .modal-tag::before{
            content:"";
            width: 10px; height: 10px;
            border-radius: 99px;
            background: linear-gradient(135deg, var(--color-accent), var(--color-accent-2));
            display:inline-block;
        }

        .modal-title { font-size: clamp(1.6rem, 3vw, 2.55rem); margin-bottom: 0.35rem; line-height: 1.08; letter-spacing: -1px; }

        .modal-loc {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin-bottom: 1.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }

        .modal-specs {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            padding-bottom: 1.8rem;
        }

        .spec-box {
            text-align: center;
            background: rgba(246,247,249,0.9);
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(0,0,0,0.06);
        }

        .spec-box strong { display: block; font-size: 1.2rem; font-weight: 900; letter-spacing: -0.5px; }
        .spec-box span { font-size: 0.86rem; color: var(--text-secondary); font-weight: 700; }

        .modal-desc h3 { margin-bottom: 10px; letter-spacing: -0.4px; }
        .modal-desc p { line-height: 1.75; color: #3A3A3F; }

        .modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-top: 2rem;
            padding-top: 1.8rem;
            border-top: 1px solid rgba(0,0,0,0.08);
        }

        .modal-price { font-size: 1.85rem; font-weight: 950; letter-spacing: -0.8px; }

        .btn-whatsapp-modal {
            background: linear-gradient(135deg, var(--color-whatsapp), #18B85A);
            color: #fff;
            padding: 14px 22px;
            border-radius: 999px;
            font-weight: 900;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
            box-shadow: 0 18px 50px rgba(37, 211, 102, 0.28);
            border: 1px solid rgba(0,0,0,0.06);
            white-space: nowrap;
        }

        .btn-whatsapp-modal:hover {
            transform: translateY(-2px);
            box-shadow: 0 22px 60px rgba(37, 211, 102, 0.33);
        }

        /* Responsividade */
        @media(max-width: 768px) {
            .modal-img-container { height: 260px; }
            .modal-content { padding: 1.5rem; }
            .modal-footer { flex-direction: column; align-items: stretch; text-align: center; }
            .modal-specs { grid-template-columns: 1fr; }
            .btn-whatsapp-modal { width: 100%; }
        }

        @media (prefers-color-scheme: dark) {
            .modal-card {
                background: rgba(19,19,26,0.86);
                border-color: rgba(255,255,255,0.10);
            }
            .modal-desc p { color: rgba(255,255,255,0.80); }
            .modal-loc { color: rgba(255,255,255,0.80); }
            .spec-box { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.10); }
            .modal-footer, .modal-specs { border-color: rgba(255,255,255,0.10); }
            .modal-close { background: rgba(19,19,26,0.86); border-color: rgba(255,255,255,0.14); color:#fff; }
        }
    </style>
</head>
<body>

    <header id="header">
        <div class="container">
            <div class="logo">SeuNomeBroker.</div>
            <nav aria-label="Navegação do catálogo">
                <a href="index.html">Início</a>
                <a href="index.html#plantas">Plantas</a>
                <a href="#" class="btn-nav" onclick="contactWhatsApp(); return false;">WhatsApp</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <section class="catalog-header">
            <h1>Nossos Empreendimentos</h1>
            <p>Selecione uma cidade para filtrar as opções.</p>

            <div class="filters-container" id="filters">
                <button class="filter-btn active" onclick="filterItems('all', this)">Todos</button>
                <button class="filter-btn" onclick="filterItems('Taguatinga', this)">Taguatinga</button>
                <button class="filter-btn" onclick="filterItems('Águas Claras', this)">Águas Claras</button>
                <button class="filter-btn" onclick="filterItems('Ceilândia', this)">Ceilândia</button>
                <button class="filter-btn" onclick="filterItems('Samambaia', this)">Samambaia</button>
                <button class="filter-btn" onclick="filterItems('Sobradinho', this)">Sobradinho</button>
                <button class="filter-btn" onclick="filterItems('Santa Maria', this)">Santa Maria</button>
                <button class="filter-btn" onclick="filterItems('Valparaíso', this)">Valparaíso</button>
                <button class="filter-btn" onclick="filterItems('Recanto das Emas', this)">Recanto das Emas</button>
            </div>
        </section>

        <div class="catalog-grid" id="grid"></div>
    </div>

    <div class="modal-overlay" id="modal" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-label="Detalhes do imóvel">
            <button class="modal-close" onclick="closeModal()" aria-label="Fechar">×</button>

            <div class="modal-img-container">
                <img id="m-img" src="" alt="Imagem do Imóvel">
            </div>

            <div class="modal-content">
                <span class="modal-tag" id="m-status">LANÇAMENTO</span>
                <h2 class="modal-title" id="m-title">Título do Imóvel</h2>
                <div class="modal-loc"><i class="ph ph-map-pin"></i> <span id="m-loc">Localização</span></div>

                <div class="modal-specs">
                    <div class="spec-box">
                        <strong id="m-beds">2</strong>
                        <span>Quartos</span>
                    </div>
                    <div class="spec-box">
                        <strong id="m-baths">1</strong>
                        <span>Banheiro</span>
                    </div>
                    <div class="spec-box">
                        <strong id="m-area">52m²</strong>
                        <span>Área</span>
                    </div>
                </div>

                <div class="modal-desc">
                    <h3>Sobre o Imóvel</h3>
                    <p id="m-desc">Descrição completa aqui...</p>
                </div>

                <div class="modal-footer">
                    <div>
                        <span style="display:block; font-size:0.92rem; color: var(--text-secondary); font-weight:800;">A partir de</span>
                        <span class="modal-price" id="m-price">R$ 000.000</span>
                    </div>
                    <button class="btn-whatsapp-modal" onclick="contactWhatsApp()">
                        <i class="ph ph-whatsapp-logo"></i> Simular Financiamento
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DADOS DOS IMÓVEIS ---
        const properties = [
            {
                id: 1,
                title: "Reserva Taguatinga",
                location: "Taguatinga, DF",
                status: "Lançamento",
                price: "R$ 245.000",
                beds: 2, baths: 1, area: "52m²",
                desc: "O Reserva Taguatinga oferece o equilíbrio perfeito entre conforto e praticidade. Localizado próximo ao JK Shopping, conta com lazer completo, piscina, academia e segurança 24h. Financiamento facilitado pela Caixa.",
                img: "https://images.unsplash.com/photo-1600596542815-2a4fa3041442?q=80&w=800"
            },
            {
                id: 2,
                title: "Top Life Club",
                location: "Ceilândia, DF",
                status: "Pronto",
                price: "R$ 290.000",
                beds: 3, baths: 2, area: "65m²",
                desc: "More em um verdadeiro resort. O Top Life Ceilândia possui mais de 20 itens de lazer, incluindo quadras poliesportivas e espaços gourmet. Próximo à estação de metrô e comércio local.",
                img: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=800"
            },
            {
                id: 3,
                title: "Vila das Águas",
                location: "Águas Claras, DF",
                status: "Na Planta",
                price: "R$ 199.000",
                beds: 1, baths: 1, area: "35m²",
                desc: "Compacto de luxo no coração de Águas Claras. Ideal para investidores ou solteiros. Rooftop com vista panorâmica e coworking no térreo.",
                img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?q=80&w=800"
            },
            {
                id: 4,
                title: "Residencial Santa Maria",
                location: "Santa Maria, DF",
                status: "Minha Casa Minha Vida",
                price: "R$ 180.000",
                beds: 2, baths: 1, area: "48m²",
                desc: "Saia do aluguel com parcelas menores que o valor do aluguel. Subsídio do governo de até 55 mil reais. Condomínio fechado com segurança.",
                img: "https://images.unsplash.com/photo-1580587771525-78b9dba3b91d?q=80&w=800"
            },
            {
                id: 5,
                title: "Altos de Sobradinho",
                location: "Sobradinho, DF",
                status: "Em Construção",
                price: "R$ 260.000",
                beds: 2, baths: 1, area: "55m²",
                desc: "Vista privilegiada para a serra e clima agradável. Apartamentos com varanda gourmet e acabamento diferenciado.",
                img: "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?q=80&w=800"
            },
            {
                id: 6,
                title: "Vista Samambaia",
                location: "Samambaia, DF",
                status: "Últimas Unidades",
                price: "R$ 230.000",
                beds: 2, baths: 1, area: "50m²",
                desc: "Localização estratégica perto do metrô. O Vista Samambaia é sinônimo de valorização. Aproveite as últimas unidades com desconto.",
                img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?q=80&w=800"
            },
            {
                id: 7,
                title: "Recanto Viver",
                location: "Recanto das Emas, DF",
                status: "Lançamento",
                price: "R$ 175.000",
                beds: 2, baths: 1, area: "46m²",
                desc: "O melhor custo-benefício da região. Entrada parcelada em até 60x direto com a construtora. Venha conhecer o decorado.",
                img: "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?q=80&w=800"
            },
            {
                id: 8,
                title: "Portal Valparaíso",
                location: "Valparaíso, GO",
                status: "Pronto",
                price: "R$ 150.000",
                beds: 2, baths: 1, area: "45m²",
                desc: "More no entorno com qualidade de vida. Próximo ao Shopping Sul. Documentação grátis (ITBI e Registro) por tempo limitado.",
                img: "https://images.unsplash.com/photo-1605276374104-dee2a0ed3cd6?q=80&w=800"
            }
        ];

        // --- RENDERIZAR CARDS ---
        const grid = document.getElementById('grid');

        function renderCards(filter = 'all') {
            grid.innerHTML = '';

            const filteredProps = filter === 'all'
                ? properties
                : properties.filter(p => p.location.includes(filter));

            if (filteredProps.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 50px; font-weight:800;">Nenhum imóvel encontrado nesta região.</p>';
                return;
            }

            filteredProps.forEach(prop => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(prop);
                card.style.cursor = 'pointer';
                card.setAttribute("role", "button");
                card.setAttribute("aria-label", `Abrir detalhes de ${prop.title}`);

                card.innerHTML = `
                    <div class="card-img">
                        <img src="${prop.img}" alt="${prop.title}">
                        <span class="badge">${prop.status}</span>
                    </div>
                    <div class="card-content">
                        <span class="card-loc"><i class="ph ph-map-pin"></i> ${prop.location}</span>
                        <h3 class="card-title">${prop.title}</h3>
                        <div class="specs">
                            <span>${prop.beds} Qts</span>
                            <span>${prop.baths} Ban</span>
                            <span>${prop.area}</span>
                        </div>
                        <div class="card-action">
                            <span class="price">${prop.price}</span>
                            <button class="btn-text" type="button">Ver Detalhes</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- FILTROS ---
        function filterItems(location, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCards(location);
        }

        // --- HEADER SCROLL EFFECT (mesma sensação do index) ---
        window.addEventListener('scroll', () => {
            const header = document.getElementById('header');
            if (!header) return;
            if (window.scrollY > 50) header.classList.add('scrolled');
            else header.classList.remove('scrolled');
        });

        // --- LÓGICA DO URL (Se vier da Home com filtro) ---
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const localFilter = params.get('local');

            if (localFilter) {
                const btns = document.querySelectorAll('.filter-btn');
                btns.forEach(b => {
                    if (b.innerText.includes(localFilter)) {
                        b.classList.add('active');
                        btns[0].classList.remove('active');
                    }
                });
                renderCards(localFilter);
            } else {
                renderCards('all');
            }
        }

        // --- MODAL LÓGICA ---
        let currentProp = null;
        const modal = document.getElementById('modal');

        function openModal(prop) {
            currentProp = prop;

            document.getElementById('m-img').src = prop.img;
            document.getElementById('m-status').innerText = prop.status;
            document.getElementById('m-title').innerText = prop.title;
            document.getElementById('m-loc').innerText = prop.location;
            document.getElementById('m-beds').innerText = prop.beds;
            document.getElementById('m-baths').innerText = prop.baths;
            document.getElementById('m-area').innerText = prop.area;
            document.getElementById('m-desc').innerText = prop.desc;
            document.getElementById('m-price').innerText = prop.price;

            modal.classList.add('open');
            modal.setAttribute("aria-hidden", "false");
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('open');
            modal.setAttribute("aria-hidden", "true");
            document.body.style.overflow = 'auto';
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Fecha com ESC
        window.addEventListener('keydown', (e) => {
            if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
        });

        // WhatsApp do Modal
        function contactWhatsApp() {
            const phone = "5561999999999"; // SEU NÚMERO
            const text = currentProp
                ? `Olá! Vi o imóvel *${currentProp.title}* (${currentProp.location}) no site e gostaria de uma simulação.`
                : "Olá! Vim pelo site e gostaria de mais informações sobre os imóveis.";
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
        }
    </script>
</body>
</html>
